<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="قائمة أسعار الخدمات للشركاء والعملاء">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests">
  <title>مكتب المهندس | الأسعار</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="font-stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" media="print">
  <link rel="stylesheet" href="styles.css?v=20261024-performance">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"></noscript>
  <script src="config.js?v=20261024" defer></script>
  <script src="app.js?v=20261024-performance" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="topbar" aria-label="التنقل الرئيسي">
      <a class="brand" href="index.html" aria-label="الرئيسية">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>مكتب المهندس</span>
      </a>
    </nav>
    <div class="hero">
      <div class="hero-copy">
        <h1>🎁 قائمة الأسعار الخاصة للمسوقين</h1>
        <p>أسعار مخفضة مبنية على السعر الرئيسي</p>
        <div class="discount-highlight">
          <strong>خصم 45%</strong>
          <span>من السعر الأساسي للموقع</span>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <span class="art-ring ring-one"></span>
        <span class="art-ring ring-two"></span>
        <span class="art-card"><span>قيمة الشراكة</span><strong>أسعار مميزة</strong><i>✦</i></span>
      </div>
    </div>
  </header>

  <main class="catalog-wrap">
    <section class="catalog-toolbar" aria-label="البحث والتصفية">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="service-search" type="search" aria-label="ابحث عن خدمة أو قسم" placeholder="ابحث عن خدمة..." autocomplete="off">
        <kbd>بحث</kbd>
      </label>
      <p class="catalog-count" id="catalog-count" aria-live="polite"></p>
    </section>
    <div id="catalog-status" class="notice" role="status">جاري تحميل قائمة الخدمات...</div>
    <div id="catalog" class="catalog-grid is-loading" aria-busy="true"></div>
  </main>

  <footer class="site-footer">
    <span>مكتب المهندس <span id="current-year"></span></span>
  </footer>
</body>
</html>
